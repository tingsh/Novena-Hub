<section class="m-section m-journey"><div class="m-wrap"><div class="m-section-head"><p class="m-eyebrow">{{ self.eyebrow }}</p><h2>{{ self.title }}</h2>{% if self.intro %}<p>{{ self.intro }}</p>{% endif %}</div><ol class="m-journey-list">{% for step in self.steps %}<li><span class="m-step-number">{{ step.number }}</span><h3>{{ step.title }}</h3><p>{{ step.detail }}</p></li>{% endfor %}</ol></div></section>
