{% load wagtailimages_tags %}
<section id="{{ self.anchor_id }}" class="m-section m-solution-section"><div class="m-wrap m-media-grid {% if self.reverse %}m-reverse{% endif %}"><div class="m-media-copy"><p class="m-eyebrow">{{ self.eyebrow }}</p><h2>{{ self.title }}</h2><p>{{ self.body }}</p><ul class="m-checks">{% for point in self.points %}<li>{{ point }}</li>{% endfor %}</ul><a class="m-text-link" href="/about/#contact">Discuss a pilot <span aria-hidden="true">↗</span></a></div><div class="m-solution-visual">{% image self.image fill-1100x900 as photo %}<img class="m-solution-photo" src="{{ photo.url }}" width="{{ photo.width }}" height="{{ photo.height }}" loading="lazy" alt="{{ self.image_alt }}">{% if self.screenshot %}<figure class="m-solution-screen">{% image self.screenshot width-800 as screen %}<img src="{{ screen.url }}" width="{{ screen.width }}" height="{{ screen.height }}" loading="lazy" alt="{{ self.screenshot_alt }}"><figcaption>Novena Hub · demonstration data</figcaption></figure>{% endif %}</div></div></section>
