{% load wagtailimages_tags %}
<section class="m-section m-photo-section"><div class="m-wrap"><div class="m-section-head"><p class="m-eyebrow">{{ self.eyebrow }}</p><h2>{{ self.title }}</h2>{% if self.intro %}<p>{{ self.intro }}</p>{% endif %}</div><div class="m-photo-grid">{% for card in self.cards %}<a class="m-photo-card" href="{{ card.link_url }}">{% image card.image fill-700x800 as photo %}<img src="{{ photo.url }}" width="{{ photo.width }}" height="{{ photo.height }}" loading="lazy" alt="{{ card.image_alt }}"><span class="m-photo-card-content"><small>{{ card.label }}</small><strong>{{ card.title }}</strong><span class="m-photo-arrow" aria-hidden="true">↗</span></span></a>{% endfor %}</div></div></section>
