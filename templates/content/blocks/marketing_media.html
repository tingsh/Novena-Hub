{% load wagtailimages_tags %}
<section class="m-section m-media-section {% if self.kind == 'product' %}m-tint{% endif %}"><div class="m-wrap m-media-grid {% if self.reverse %}m-reverse{% endif %}"><div class="m-media-copy"><p class="m-eyebrow">{{ self.eyebrow }}</p><h2>{{ self.title }}</h2>{% if self.body %}<p>{{ self.body }}</p>{% endif %}{% if self.points %}<ul class="m-checks">{% for point in self.points %}<li>{{ point }}</li>{% endfor %}</ul>{% endif %}{% if self.link_url %}<a class="m-text-link" href="{{ self.link_url }}">{{ self.link_text }} <span aria-hidden="true">↗</span></a>{% endif %}</div><figure class="m-media-figure {% if self.kind == 'product' %}m-product-frame{% endif %}">{% image self.image width-1400 as visual %}<img src="{{ visual.url }}" width="{{ visual.width }}" height="{{ visual.height }}" loading="lazy" alt="{{ self.image_alt }}">{% if self.caption %}<figcaption>{{ self.caption }}</figcaption>{% endif %}</figure></div></section>
