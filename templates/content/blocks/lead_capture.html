<section id="contact" class="m-section m-contact-section"><div class="m-wrap m-contact-grid"><div><p class="m-eyebrow">{{ self.tagline }}</p><h2>{{ self.title }}</h2><p>{{ self.body }}</p><div class="m-contact-aside"><strong>What helps us prepare</strong><span>A site, an equipment group, or one signal you need to understand.</span></div></div><form method="post" action="{% url 'support:sales_inquiry' %}" data-marketing-inquiry class="m-contact-form">{% csrf_token %}<input type="text" name="company_website" hidden tabindex="-1" autocomplete="off"><div id="sales-inquiry-result" role="status" aria-live="polite"></div><div class="m-form-grid"><label>Name<input name="name" required autocomplete="name"></label><label>Work email<input type="email" name="email" required autocomplete="email"></label><label>Company<input name="company" required autocomplete="organization"></label><label>Interest<select name="interest"><option>{{ self.default_interest }}</option><option>Energy monitoring</option><option>Cold chain monitoring</option><option>Manufacturing</option><option>Facilities</option></select></label></div><label>What would you like to monitor?<textarea name="message" required rows="4"></textarea></label><button class="m-button m-button-primary" type="submit">Request demo</button><p>We use these details to respond to your inquiry. See our <a href="/privacy/">privacy notice</a>.</p></form></div></section>
