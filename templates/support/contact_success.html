{% load i18n %}
<div class="p-12 text-center space-y-4">
    <div class="w-16 h-16 rounded-full bg-success/10 text-success flex items-center justify-center mx-auto text-2xl animate-pulse">
        <i class="fa-solid fa-circle-check"></i>
    </div>
    <h3 class="text-lg font-black text-base-content font-heading">{% translate "Support request sent" %}</h3>
    <p class="text-xs text-base-content/50 max-w-sm mx-auto leading-relaxed">
        {% translate "Your message was accepted for delivery to Novena support. We will reply to your account email address." %}
    </p>
    <div class="pt-6">
        <button type="button" onclick="document.getElementById('contact-support-modal').close(); setTimeout(() => { window.location.reload(); }, 150);" class="btn btn-primary rounded-2xl font-black uppercase tracking-widest text-xs px-8 shadow-lg shadow-indigo-500/20">
            {% translate "Close Window" %}
        </button>
    </div>
</div>
