<div class="h-full overflow-auto divide-y divide-base-content/10">
    {% for item in attention_items %}
    <article class="command-center-list-item attention-item px-5 py-4" data-item-index="{{ forloop.counter0 }}">
        <div class="flex items-start gap-3">
            <span class="mt-1.5 h-2.5 w-2.5 shrink-0 rounded-full {% if item.tone == 'red' %}bg-red-500{% elif item.tone == 'amber' %}bg-amber-500{% elif item.tone == 'blue' %}bg-blue-500{% else %}bg-base-content/30{% endif %}"></span>
            <div class="min-w-0 flex-1">
                <div class="flex items-start justify-between gap-3"><p class="truncate text-sm font-semibold">{{ item.title }}</p>{% if item.occurred_at %}<time class="panel-expanded-only shrink-0 text-[10px] text-base-content/40">{{ item.occurred_at|timesince }} ago</time>{% endif %}</div>
                <p class="mt-1 text-xs text-base-content/55">{{ item.message }}</p>
                <div class="mt-2 flex items-center justify-between gap-3"><p class="text-[10px] font-bold uppercase tracking-wide text-base-content/40">{{ item.kind }}</p><a href="{{ item.action_url }}" class="text-xs font-bold text-primary">{{ item.action_label }}</a></div>
            </div>
        </div>
    </article>
    {% empty %}
    <div class="flex h-full items-center justify-center px-5 py-12 text-center text-base-content/45"><div><i class="fa fa-shield-check text-2xl"></i><p class="mt-2 text-xs font-bold uppercase tracking-wide">All clear</p></div></div>
    {% endfor %}
</div>
